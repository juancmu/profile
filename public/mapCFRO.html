<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        GIS
    </title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="./lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./lib/leaflet/Leaflet.PolylineMeasure.css" />
    <link rel="stylesheet" href="./lib/leaflet/L.Control.Layers.Tree.css" crossorigin="" />
    <link rel="stylesheet" href="./lib/leaflet/MarkerCluster.css" />
    <link rel="stylesheet" href="./lib/leaflet/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="./lib/leaflet/L.Control.Locate/L.Control.Locate.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/geovisor.css">
    <link rel="stylesheet" href="./css/legend.css">

    <style>
        /* Simple loading spinner */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h3 class="ms-3 text-primary">Loading Map Data...</h3>
    </div>

    <div class="container-gis">

        <!-- Search bar: overlays map on desktop, sits above on mobile -->
        <div id="map-search-bar"
            style="width: auto; background: rgba(255,255,255,0.85); padding: 8px 15px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px);">
            <!-- Link to Lands Dashboard -->
            <div class="d-flex align-items-center me-2">
                <a href="/lands" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm"
                    style="border-radius: 50px; padding: 6px 16px; background: linear-gradient(135deg, #1665c0, #0b2756); border: none; font-weight: 500; font-size: 0.85rem;"
                    target="_blank">
                    <i class="bi bi-bar-chart-fill"></i>
                    <span>Dashboard</span>
                </a>
            </div>

            <div class="position-relative" style="width: 150px;">
                <input type="text" id="searchBox" class="form-control pe-5 shadow-sm" placeholder="Search Land..."
                    style="border-radius: 20px;">
                <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3"></i>
                <div class="results shadow bg-white rounded" id="results" style="display:none;"></div>
            </div>

            <div class="position-relative" style="width: 180px;">
                <input type="text" id="a1mSearchBox" placeholder='Search by PK...like (3+000) type 3000'
                    class="form-control pe-1 shadow-sm" style="border-radius: 20px;">
                <div class="results shadow bg-white rounded" id="a1mResults" style="display:none;"></div>
            </div>

            <!-- Section filter -->
            <div class="position-relative d-flex align-items-center">
                <select id="sectionFilter" class="form-select shadow-sm"
                    style="border-radius:20px; width:180px; font-size:0.85rem;">
                    <option value="">All Sections (Tramos)</option>
                    <option value="1">Tramo 1</option>
                    <option value="2">Tramo 2</option>
                    <option value="3">Tramo 3</option>
                    <option value="4">Tramo 4</option>
                    <option value="5">Tramo 5</option>
                    <option value="6">Tramo 6</option>
                    <option value="7">Tramo 7</option>
                    <option value="8">Tramo 8</option>
                    <option value="9">Tramo 9</option>
                    <option value="10">Tramo 10</option>
                    <option value="11">Tramo 11</option>
                    <option value="12">Tramo 12</option>
                    <option value="13">Tramo 13</option>
                    <option value="14">Tramo 14</option>
                    <option value="15">Tramo 15</option>
                    <option value="16">Tramo 16</option>
                    <option value="17">Tramo 17</option>
                    <option value="18">Tramo 18</option>
                </select>
            </div>

            <!-- Rotate control placeholder -->
            <div id="rotate-control-container" class="d-flex align-items-center">Push and Hold to Rotate.</div>
        </div>

        <div id="map" class="map2 w-100">
            <div id="legend" class="legend w-auto">
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JS & Plugins -->
    <script src="./lib/leaflet/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <script src="./lib/leaflet/Leaflet.PolylineMeasure.js"></script>
    <script src="./lib/leaflet/L.Control.Layers.Tree.js"></script>
    <script src="./lib/leaflet/leaflet.polylineDecorator.js"></script>
    <script src="./lib/leaflet/leaflet.markercluster-src.js"></script>
    <script src="./lib/leaflet/OSMBuildings-Leaflet.js"></script>
    <script src="./lib/leaflet/L.Control.Locate/L.Control.Locate.min.js"></script>
    <!-- Map Application Logic -->
    <script src="./js/GIS-UNI.js"></script>

    <!-- Map Plugins depending on initialized map -->
    <script src="./lib/leaflet/measure.js"></script>
    <script src="./lib/leaflet/street-view.js"></script>

</body>

</html>
